<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Narrative Visualization Browser</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f2ec;
    --surface: #ffffff;
    --ink: #1a1612;
    --ink-muted: #6b6259;
    --accent: #c94f2a;
    --accent-light: #f0ddd7;
    --border: #e0d9d0;
    --tag-bg: #ede8e1;
    --tag-active: #c94f2a;
    --tag-active-text: #fff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    line-height: 1.5;
    min-height: 100vh;
  }

  /* Header */
  header {
    background: var(--ink);
    color: #fff;
    padding: 40px 48px 32px;
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      -45deg,
      transparent,
      transparent 20px,
      rgba(255,255,255,0.03) 20px,
      rgba(255,255,255,0.03) 21px
    );
  }
  header h1 {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(2rem, 5vw, 3.2rem);
    line-height: 1.1;
    letter-spacing: -0.02em;
    position: relative;
  }
  header h1 em {
    color: #e8a090;
    font-style: italic;
  }
  header p {
    margin-top: 10px;
    color: rgba(255,255,255,0.6);
    font-size: 14px;
    font-weight: 300;
    position: relative;
    max-width: 560px;
  }
  .header-meta {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-top: 20px;
    position: relative;
  }
  .count-badge {
    background: var(--accent);
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 4px 12px;
    border-radius: 100px;
  }

  /* Controls */
  .controls {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 20px 48px;
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-items: flex-start;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }
  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 200px;
    max-width: 320px;
  }
  .search-wrap svg {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--ink-muted);
    pointer-events: none;
  }
  input[type="search"] {
    width: 100%;
    padding: 9px 12px 9px 38px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    font-family: inherit;
    font-size: 14px;
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s;
  }
  input[type="search"]:focus { border-color: var(--accent); }

  .filter-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .filter-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }
  .filter-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .tag {
    padding: 5px 12px;
    border-radius: 100px;
    font-size: 12px;
    font-weight: 500;
    background: var(--tag-bg);
    color: var(--ink-muted);
    cursor: pointer;
    border: 1.5px solid transparent;
    transition: all 0.15s;
    user-select: none;
    white-space: nowrap;
  }
  .tag:hover { border-color: var(--accent); color: var(--accent); }
  .tag.active { background: var(--tag-active); color: var(--tag-active-text); border-color: var(--tag-active); }

  .reset-btn {
    margin-left: auto;
    align-self: flex-end;
    padding: 8px 16px;
    border-radius: 8px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    background: transparent;
    color: var(--ink-muted);
    border: 1.5px solid var(--border);
    cursor: pointer;
    transition: all 0.15s;
  }
  .reset-btn:hover { border-color: var(--ink-muted); color: var(--ink); }

  /* Results bar */
  .results-bar {
    padding: 14px 48px;
    font-size: 13px;
    color: var(--ink-muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .results-bar strong { color: var(--ink); }

  /* Grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
    padding: 0 48px 60px;
  }

  /* Card */
  .card {
    background: var(--surface);
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--border);
    transition: transform 0.18s, box-shadow 0.18s;
    display: flex;
    flex-direction: column;
  }
  .card:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 32px rgba(26,22,18,0.12);
  }

  .card-thumb {
    width: 100%;
    aspect-ratio: 16/9;
    background: var(--tag-bg);
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card-thumb img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  .card-thumb img.loaded {
    opacity: 1;
  }
  .card-thumb .thumb-placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, var(--tag-bg) 0%, #ddd5ca 100%);
    color: var(--ink-muted);
    font-size: 11px;
    text-align: center;
    padding: 16px;
    font-weight: 500;
    letter-spacing: 0.02em;
  }
  .card-thumb .genre-badge {
    position: absolute;
    top: 10px;
    left: 10px;
    background: rgba(26,22,18,0.75);
    color: #fff;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    padding: 3px 9px;
    border-radius: 100px;
    backdrop-filter: blur(4px);
  }

  .card-body {
    padding: 16px;
    display: flex;
    flex-direction: column;
    flex: 1;
    gap: 10px;
  }
  .card-title {
    font-family: 'DM Serif Display', serif;
    font-size: 15px;
    line-height: 1.3;
    color: var(--ink);
  }
  .card-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-top: auto;
  }
  .meta-tag {
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 100px;
    background: var(--accent-light);
    color: var(--accent);
    font-weight: 500;
  }
  .meta-tag.structure {
    background: #ddeaf3;
    color: #2a5c8a;
  }
  .meta-tag.narrative {
    background: #ddf3e4;
    color: #1f7a40;
  }
  .card-link {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    text-decoration: none;
    margin-top: 4px;
    transition: gap 0.15s;
  }
  .card-link:hover { gap: 8px; }
  .no-url {
    font-size: 12px;
    color: var(--ink-muted);
    font-style: italic;
    margin-top: 4px;
  }

  /* Empty state */
  .empty {
    grid-column: 1/-1;
    text-align: center;
    padding: 80px 24px;
    color: var(--ink-muted);
  }
  .empty h2 {
    font-family: 'DM Serif Display', serif;
    font-size: 1.8rem;
    margin-bottom: 8px;
    color: var(--ink);
  }

  /* Footer */
  footer {
    border-top: 1px solid var(--border);
    padding: 24px 48px;
    font-size: 12px;
    color: var(--ink-muted);
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  @media (max-width: 640px) {
    header, .controls, .results-bar, .grid, footer { padding-left: 20px; padding-right: 20px; }
    .grid { grid-template-columns: 1fr 1fr; gap: 12px; }
    .controls { gap: 12px; }
  }
  @media (max-width: 420px) {
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>

//State 
const state = { search: '', genre: '', structure: '', narrative: '' };

//filter options
function unique(key) {
  return [...new Set(DATA.map(d => d[key]).filter(Boolean))].sort();
}

function buildTags(containerId, key, values) {
  const wrap = document.getElementById(containerId);
  values.forEach(v => {
    const btn = document.createElement('button');
    btn.className = 'tag';
    btn.textContent = v;
    btn.dataset.value = v;
    btn.addEventListener('click', () => {
      state[key] = state[key] === v ? '' : v;
      renderTags();
      renderCards();
    });
    wrap.appendChild(btn);
  });
}

function renderTags() {
  document.querySelectorAll('#filter-genre .tag').forEach(t =>
    t.classList.toggle('active', t.dataset.value === state.genre));
  document.querySelectorAll('#filter-structure .tag').forEach(t =>
    t.classList.toggle('active', t.dataset.value === state.structure));
  document.querySelectorAll('#filter-narrative .tag').forEach(t =>
    t.classList.toggle('active', t.dataset.value === state.narrative));
}

//Card renderer
function isRealUrl(url) {
  return url && (url.startsWith('http://') || url.startsWith('https://'));
}

function getDomain(url) {
  try { return new URL(url).hostname; } catch { return null; }
}

function createCard(d, i) {
  const realUrl = isRealUrl(d.url);
  const domain = realUrl ? getDomain(d.url) : null;
  const imgNum = i + 1;

  // Fallback colour derived from title
  let hash = 0;
  for (let c = 0; c < d.title.length; c++) hash = d.title.charCodeAt(c) + ((hash << 5) - hash);
  const hue = Math.abs(hash) % 360;
  const bg1 = `hsl(${hue},20%,88%)`;
  const bg2 = `hsl(${hue},25%,78%)`;

  const otherTags = d.otherGenres
    ? d.otherGenres.split(',').map(g => g.trim()).filter(Boolean)
    : [];

  return `
  <div class="card">
    <div class="card-thumb">
      <div class="thumb-placeholder" style="background:linear-gradient(135deg,${bg1},${bg2})">
        <span>${escHtml(d.title.substring(0,60))}${d.title.length > 60 ? '…' : ''}</span>
      </div>
      <img
        src="images/${imgNum}.jpg"
        loading="lazy"
        onload="this.classList.add('loaded')"
        onerror="this.style.display='none'"
        alt="${escHtml(d.title)}"
      >
      <span class="genre-badge">${escHtml(d.mainGenre)}</span>
    </div>
    <div class="card-body">
      <div class="card-title">${escHtml(d.title)}</div>
      <div class="card-meta">
        ${otherTags.map(t => `<span class="meta-tag">${escHtml(t)}</span>`).join('')}
        <span class="meta-tag structure">${escHtml(d.structure)}</span>
        <span class="meta-tag narrative">${escHtml(d.narrative)}</span>
      </div>
      ${realUrl
        ? `<a class="card-link" href="${escHtml(d.url)}" target="_blank" rel="noopener">Ver ↗</a>`
        : `<span class="no-url">URL not available</span>`
      }
    </div>
  </div>`;
}

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

//Filter & render
function filterData() {
  const q = state.search.toLowerCase();
  return DATA.filter(d => {
    if (q && !d.title.toLowerCase().includes(q)) return false;
    if (state.genre && d.mainGenre !== state.genre) return false;
    if (state.structure && d.structure !== state.structure) return false;
    if (state.narrative && d.narrative !== state.narrative) return false;
    return true;
  });
}

function renderCards() {
  const filtered = filterData();
  const grid = document.getElementById('grid');
  document.getElementById('count-shown').textContent = filtered.length;

  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty"><h2>No results found</h2><p>Try clearing some filters.</p></div>`;
    return;
  }
  grid.innerHTML = filtered.map((d, i) => createCard(d, DATA.indexOf(d))).join('');
}

//Init
buildTags('filter-genre', 'genre', unique('mainGenre'));
buildTags('filter-structure', 'structure', unique('structure'));
buildTags('filter-narrative', 'narrative', unique('narrative'));

document.getElementById('total-badge').textContent = `${DATA.length} sites`;
document.getElementById('count-total').textContent = DATA.length;
document.getElementById('footer-date').textContent = `Last updated: ${new Date().toLocaleDateString('en-US',{year:'numeric',month:'long'})}`;

document.getElementById('search').addEventListener('input', e => {
  state.search = e.target.value;
  renderCards();
});

document.getElementById('reset-btn').addEventListener('click', () => {
  state.search = ''; state.genre = ''; state.structure = ''; state.narrative = '';
  document.getElementById('search').value = '';
  renderTags();
  renderCards();
});

renderCards();
</script>
